name: Deploy site to GitHub Pages

# The landing page embeds the real popup as a demo, so the site is rebuilt
# whenever the popup or its translations change too.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'entrypoints/popup/**'
      - 'components/**'
      - 'public/_locales/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the popup demo
        run: pnpm build && node scripts/build-demo.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
